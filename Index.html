<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيدلية زمزم — سجلّ الشِّفت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F4;
    --surface:#FFFFFF;
    --ink:#1A1A1A;
    --muted:#6B6B6B;
    --accent:#C81E1E;
    --accent-ink:#8C1414;
    --accent-soft:#FBE1DF;
    --ok:#1F9D6B;
    --ok-ink:#0F6B4C;
    --ok-soft:#DCF2E9;
    --danger:#B0201F;
    --danger-soft:#FBE1DF;
    --border:#E5E0DE;
    --radius:10px;
    --shadow:0 1px 2px rgba(26,26,26,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    line-height:1.65;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;font-weight:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-weight:inherit;}
  svg{display:block;}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:16px 60px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand .mark{
    height:112px;width:auto;
    display:block;
    flex:none;
    animation: logo-in .8s cubic-bezier(.2,.8,.2,1) both, logo-breathe 2.4s ease-in-out .8s infinite;
    transform-origin:center;
    will-change: transform;
  }
  @keyframes logo-in{
    0%{ opacity:0; transform:scale(.4) rotate(-15deg); }
    55%{ opacity:1; transform:scale(1.15) rotate(4deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes logo-breathe{
    0%, 100%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(1.12) rotate(-2deg); }
  }
  .brand-text{text-align:center;}
  .brand h1{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:32px;
    margin:0;
    color:var(--accent);
    line-height:1.15;
    text-align:center;
  }
  .brand span.sub{font-size:12.5px;color:var(--muted);display:block;text-align:center;}

  .menu-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
    width:46px;height:46px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;flex:none;
    position:absolute;left:20px;top:50%;transform:translateY(-50%);
  }
  .menu-btn:hover{background:var(--bg);}
  .menu-btn .ic{width:20px;height:20px;}

  .sidebar-backdrop{
    position:fixed;inset:0;background:rgba(20,20,20,.42);
    z-index:55;opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .sidebar-backdrop.show{opacity:1;pointer-events:auto;}
  .sidebar{
    position:fixed;top:0;right:0;height:100%;width:290px;max-width:84vw;
    background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.16);
    z-index:60;transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:1px solid var(--border);
    font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;
  }
  .sidebar-nav{display:flex;flex-direction:column;padding:12px;gap:4px;}
  .sidebar-link{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;border-radius:10px;border:none;background:transparent;
    font-size:14.5px;font-weight:700;color:var(--ink);text-align:right;
  }
  .sidebar-link:hover{background:var(--bg);}
  .sidebar-link.active{background:var(--accent-soft);color:var(--accent-ink);}
  .sidebar-link .ic{width:19px;height:19px;flex:none;}

  main{max-width:880px;margin:0 auto;padding:32px 20px 80px;}

  /* ---------- Card ---------- */
  .label-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:20px;
    overflow:hidden;
  }
  .label-card .tag-edge{height:5px;background:linear-gradient(90deg,var(--accent),var(--ink));opacity:.8;}
  .label-card .body{padding:22px 24px;}
  .section-title{
    font-family:'Cairo',sans-serif;
    font-size:17.5px;font-weight:700;
    margin:0 0 4px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title .icon-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9px;
    background:var(--accent-soft);color:var(--accent-ink);
    flex:none;
  }
  .section-title .icon-badge .ic{width:17px;height:17px;}
  .section-hint{font-size:13px;color:var(--muted);margin:0 0 16px;padding-right:42px;}

  /* ---------- Shift picker ---------- */
  .shift-picker{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .shift-option{
    flex:1 1 180px;border:1.5px solid var(--border);background:var(--surface);
    border-radius:var(--radius);padding:16px;
    display:flex;align-items:center;gap:12px;text-align:right;
  }
  .shift-option .icon{width:40px;height:40px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);}
  .shift-option .icon .ic{width:19px;height:19px;}
  .shift-option[data-shift="morning"] .icon{background:var(--accent-soft);color:var(--accent-ink);}
  .shift-option[data-shift="evening"] .icon{background:#EAEAEA;color:var(--ink);}
  .shift-option strong{display:block;font-size:14.5px;font-family:'Cairo',sans-serif;}
  .shift-option small{color:var(--muted);font-size:12px;}
  .shift-option.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:700;color:var(--muted);}
  .field input, .field textarea, .field select{
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font-size:14px;background:var(--bg);color:var(--ink);font-family:inherit;font-weight:700;
  }
  .field input:focus, .field textarea:focus, .field select:focus, .task-reason:focus{outline:none;border-color:var(--accent);background:#fff;}

  /* ---------- Task rows ---------- */
  .task-list{display:flex;flex-direction:column;}
  .task-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-top:1px solid var(--border);}
  .task-row:first-child{border-top:none;padding-top:2px;}
  .task-text{flex:1;font-size:14.5px;padding-top:7px;}
  .task-controls{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:230px;}
  .status-toggle{display:flex;gap:6px;}
  .status-toggle button{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);background:var(--surface);
    padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);
  }
  .status-toggle button .ic{width:14px;height:14px;}
  .status-toggle button.done.selected{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink);}
  .status-toggle button.notdone.selected{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .task-reason{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;}
  .task-reason.reason-mode{border-color:var(--danger);}
  .task-reason.note-mode{border-color:var(--border);}
  .task-amount{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;text-align:left;direction:ltr;}
  .task-amount-wrap{width:100%;display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
  .task-amount-wrap span{font-size:11px;color:var(--muted);}

  .task-photo-wrap{width:100%;display:flex;justify-content:flex-end;}
  .photo-add-btn{
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    border:1.5px dashed var(--border);border-radius:8px;
    padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--muted);
  }
  .photo-add-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .photo-add-btn .ic{width:15px;height:15px;}
  .task-photo-wrap.needs-photo .photo-add-btn{border-color:var(--danger);color:var(--danger);border-style:solid;background:var(--danger-soft);}
  .task-photo-preview{position:relative;display:inline-block;}
  .task-photo-preview img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
  .photo-remove-btn{
    position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;
    background:var(--danger);color:#fff;border:2px solid var(--surface);
    display:flex;align-items:center;justify-content:center;
  }
  .photo-remove-btn .ic{width:12px;height:12px;}
  .detail-photo{margin-top:6px;}
  .detail-photo img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;}
  .photo-lightbox{
    position:fixed;inset:0;background:rgba(10,10,10,.85);
    display:flex;align-items:center;justify-content:center;
    z-index:70;padding:24px;cursor:zoom-out;
  }
  .photo-lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4);}

  .notes-grid{display:flex;flex-direction:column;gap:14px;}
  .notes-grid .field textarea{min-height:56px;resize:vertical;}

  .submit-bar{display:flex;justify-content:flex-end;gap:12px;margin-top:8px;}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:12px 24px;font-size:14.5px;font-weight:800;}
  .btn .ic{width:16px;height:16px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger-soft);}
  .btn-small{padding:7px 14px;font-size:13px;border-radius:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
    font-size:14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .toast .ic{width:16px;height:16px;}

  /* ---------- Dashboard ---------- */
  .subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .subtabs button{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--border);background:var(--surface);
    padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);
  }
  .subtabs button .ic{width:15px;height:15px;}
  .subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .task-edit-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
  .task-edit-row:first-child{border-top:none;}
  .task-edit-row input[type=text]{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--bg);}
  .allow-note-toggle{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none;}
  .allow-note-toggle input{width:15px;height:15px;accent-color:var(--accent);}
  .section-edit-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .section-edit-head .section-title-input{flex:1;min-width:140px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:15px;font-family:'Cairo',sans-serif;font-weight:800;background:var(--bg);color:var(--ink);}
  .section-edit-head .section-title-input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .section-edit-head .section-type-select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;background:var(--surface);max-width:220px;flex:none;}
  .icon-btn{border:none;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
  .icon-btn .ic{width:16px;height:16px;}
  .icon-btn:hover{background:var(--danger-soft);color:var(--danger);}
  .add-task-btn{
    margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;
    border:1.5px dashed var(--border);background:transparent;color:var(--muted);
    padding:9px;width:100%;border-radius:8px;font-size:13.5px;font-weight:700;
  }
  .add-task-btn .ic{width:15px;height:15px;}
  .add-task-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .add-task-btn.shift-add-btn{margin-top:0;width:auto;min-height:72px;}

  .shift-option.editable{cursor:pointer;}
  .shift-option.editable .shift-name-input{
    flex:1;min-width:0;border:1px solid var(--border);border-radius:7px;
    padding:8px 10px;font-size:14px;font-family:'Cairo',sans-serif;font-weight:700;
    background:var(--bg);color:var(--ink);
  }
  .shift-option.editable .shift-name-input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .shift-delete-btn{flex:none;}

  .eval-filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .eval-filters select, .eval-filters input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13.5px;background:var(--surface);}

  .eval-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;}
  .eval-item .eval-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:var(--accent-ink);}
  .eval-item .eval-icon .ic{width:17px;height:17px;}
  .eval-item[data-shift="morning"] .eval-icon{background:var(--accent-soft);color:var(--accent-ink);}
  .eval-item[data-shift="evening"] .eval-icon{background:#EAEAEA;color:var(--ink);}
  .eval-item-body{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .eval-badge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);}
  .eval-badge.morning{background:var(--accent-soft);color:var(--accent-ink);}
  .eval-badge.evening{background:#EAEAEA;color:var(--ink);}
  .eval-meta{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .eval-stats{display:flex;gap:8px;font-size:12px;}
  .stat-pill{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-weight:700;}
  .stat-pill .ic{width:12px;height:12px;}
  .stat-pill.ok{background:var(--ok-soft);color:var(--ok-ink);}
  .stat-pill.bad{background:var(--danger-soft);color:var(--danger);}
  .stat-pill.score-pill{background:#EFE7FB;color:#5B34A8;}

  .grade-badge{font-size:13px;font-weight:800;padding:6px 14px;border-radius:999px;white-space:nowrap;}
  .grade-badge.grade-excellent{background:var(--ok-soft);color:var(--ok-ink);}
  .grade-badge.grade-vgood{background:#E4F3EA;color:#2C7A4B;}
  .grade-badge.grade-good{background:#EAF1E1;color:#5C7A2C;}
  .grade-badge.grade-fair{background:#FBF1D9;color:#9A7212;}
  .grade-badge.grade-weak{background:var(--danger-soft);color:var(--danger);}

  .emp-rating-row{padding:14px 0;border-top:1px solid var(--border);}
  .emp-rating-row:first-child{border-top:none;padding-top:2px;}
  .emp-rating-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .emp-name{font-weight:800;font-size:14.5px;}
  .stars-row{display:flex;gap:3px;}
  .star-btn{background:none;border:none;padding:2px;cursor:pointer;color:#DCDAD7;flex:none;}
  .star-btn.filled{color:#F0A93B;}
  .star-btn svg{width:26px;height:26px;fill:currentColor;display:block;}
  .emp-reason{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--bg);min-height:44px;resize:vertical;font-family:inherit;font-weight:700;}
  .emp-reason:focus{outline:none;border-color:var(--accent);background:#fff;}

  .emp-rank-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .emp-rank-title{font-size:13.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--accent-ink);}
  .emp-rank-title .ic{width:16px;height:16px;color:#F0A93B;}
  .emp-rank-list{display:flex;flex-direction:column;gap:2px;}
  .emp-rank-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--muted);}
  .emp-rank-row.top{color:var(--ink);font-weight:800;}

  .day-shift-pills{display:flex;flex-wrap:wrap;gap:8px;}
  .day-shift-pill{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .day-shift-pill .ic{width:14px;height:14px;}
  .day-shift-pill.done{background:var(--ok-soft);color:var(--ok-ink);}
  .day-shift-pill.missing{background:var(--danger-soft);color:var(--danger);}
  .eval-quick-delete{flex:none;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .mark{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .empty-state .mark .ic{width:24px;height:24px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,28,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:40;}
  .modal{background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;padding:26px 28px;box-shadow:0 20px 40px rgba(0,0,0,.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .modal h2{font-family:'Cairo',sans-serif;font-size:19px;margin:0 0 4px;}
  .close-x{border:none;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .close-x:hover{background:var(--bg);}
  .detail-block{margin-bottom:16px;}
  .detail-block h4{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0 0 8px;color:var(--muted);font-weight:700;}
  .detail-block h4 .ic{width:15px;height:15px;}
  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:13.5px;}
  .detail-row:first-child{border-top:none;}
  .detail-row .status{display:flex;align-items:center;gap:5px;font-weight:800;white-space:nowrap;}
  .detail-row .status .ic{width:14px;height:14px;}
  .detail-row .status.ok{color:var(--ok-ink);}
  .detail-row .status.bad{color:var(--danger);}
  .detail-note{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .pin-gate{max-width:340px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;text-align:center;}
  .pin-gate .mark{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
  .pin-gate .mark .ic{width:22px;height:22px;}
  .pin-gate > input{width:100%;text-align:center;letter-spacing:4px;font-size:20px;border:1px solid var(--border);border-radius:8px;padding:12px;margin:16px 0;background:var(--bg);}
  .pin-error{color:var(--danger);font-size:13px;min-height:18px;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--border);}
  .settings-row:first-child{border-top:none;}
  .settings-row input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;width:120px;text-align:center;}

  .user-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap;}
  .user-row:first-child{border-top:none;}
  .user-row-name{font-weight:800;font-size:14.5px;}
  .user-row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .admin-tag{display:inline-block;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-right:6px;}

  .storage-note{
    display:flex;gap:10px;align-items:flex-start;
    background:#FDF0DC;border:1px solid #F0D9AE;color:#7A5312;
    border-radius:var(--radius);padding:12px 16px;font-size:12.5px;margin-bottom:20px;
  }
  .storage-note .ic{width:17px;height:17px;flex:none;margin-top:1px;}

  @media (max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .task-row{flex-direction:column;}
    .task-controls{align-items:flex-start;min-width:0;width:100%;}
    .topbar{padding:14px 54px;}
    .menu-btn{left:12px;width:40px;height:40px;}
    .brand{gap:10px;}
    .brand .mark{height:64px;}
    .brand h1{font-size:22px;}
    main{padding:22px 12px 70px;}
  }
</style>
</head>

  function withTimeout(promise, ms){
    return new Promise((resolve, reject)=>{
      const t = setTimeout(()=>reject(new Error("firestore-timeout")), ms);
      promise.then(
        v=>{ clearTimeout(t); resolve(v); },
        e=>{ clearTimeout(t); reject(e); }
      );
    });
  }

        await withTimeout(CONFIG_DOC().set(cfg), 6000);
        return cfg;
      }catch(e){ usingFallback = true; }
    }
    let cfg = localAdapter.getConfig();
    if(!cfg){ cfg = defaultConfig(); localAdapter.setConfig(cfg); }
    return normalizeConfig(cfg);
  }

  async function findTodayEvaluation(shiftKey){
    const today = todayISO();
    const isAdmin = !!(authProfile && authProfile.isAdmin);
    if(!usingFallback){
      try{
        let query = EVALS_COL().where("shiftKey","==",shiftKey).where("date","==",today);
        if(!isAdmin && authUser){
          // Non-admins can only read their own evaluations per the security rules,
          // so this query must be scoped to their own uid or Firestore will reject it —
          // that rejection must NOT be treated as "Firestore is unreachable".
          query = query.where("submittedByUid","==",authUser.uid);
        }
        const snap = await withTimeout(query.get(), 6000);
        return snap.empty ? null : { id: snap.docs[0].id, data: snap.docs[0].data() };
      }catch(e){
        // Swallow the error without flipping the global usingFallback flag — a failure
        // here is most likely a permissions/index issue scoped to this one check, not a
        // sign that Firestore itself is unreachable. Treat it as "couldn't verify, allow".
        return null;
      }
    }
    const items = localAdapter.listEvaluations().filter(x=>
      x.data.shiftKey===shiftKey && x.data.date===today &&
      (isAdmin || !authUser || x.data.submittedByUid===authUser.uid)
    );
    return items.length ? items[0] : null;
  }

  function taskRowHtml(task, state, sectionType){
    const allowNote = !!task.allowNote;
    const allowPhoto = !!task.allowPhoto;
    const showAmount = sectionType === "amount";
    const isReasonMode = state.status === "notdone";
    const showNoteBox = isReasonMode || allowNote;
    return `
      <div class="task-row" data-allownote="${allowNote?'1':'0'}" data-amount="${showAmount?'1':'0'}">
        <div class="task-text">${escapeHtml(task.text)}</div>
        <div class="task-controls">
          <div class="status-toggle">
            <button type="button" class="done ${state.status==='done'?'selected':''}" data-status="done">${ICONS.check} تمّ</button>
            <button type="button" class="notdone ${state.status==='notdone'?'selected':''}" data-status="notdone">${ICONS.close} لم يتم</button>
          </div>
          ${showAmount ? `
            <div class="task-amount-wrap">
              <span>قيمة العجز / الزيادة</span>
              <input type="text" class="task-amount" placeholder="٠" value="${escapeHtml(state.amount||'')}">
            </div>` : ``}
          <input type="text" class="task-reason ${isReasonMode?'reason-mode':'note-mode'}" style="${showNoteBox?'':'display:none'}" placeholder="${isReasonMode?'السبب':'ملاحظة (اختياري)'}" value="${escapeHtml(state.reason||'')}">
          ${allowPhoto ? `<div class="task-photo-wrap"></div>` : ``}
        </div>
      </div>
    `;
  }

  function bindTaskRows(listEl, stateArr){
    if(!listEl) return;
    listEl.querySelectorAll(".task-row").forEach((row, i)=>{
      const allowNote = row.getAttribute("data-allownote") === "1";
      row.querySelectorAll("[data-status]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          stateArr[i].status = btn.getAttribute("data-status");
          const reasonInput = row.querySelector(".task-reason");
          row.querySelectorAll("[data-status]").forEach(b=>b.classList.remove("selected"));
          btn.classList.add("selected");
          const isReasonMode = stateArr[i].status === "notdone";
          const show = isReasonMode || allowNote;
          if(reasonInput){
            if(show){
              reasonInput.style.display = "";
              reasonInput.placeholder = isReasonMode ? "السبب" : "ملاحظة (اختياري)";
              reasonInput.classList.toggle("reason-mode", isReasonMode);
              reasonInput.classList.toggle("note-mode", !isReasonMode);
              if(isReasonMode) reasonInput.focus();
            } else {
              reasonInput.style.display = "none";
              stateArr[i].reason = "";
              reasonInput.value = "";
            }
          }
        });
      });
      const reasonInput = row.querySelector(".task-reason");
      if(reasonInput) reasonInput.addEventListener("input", e=>{ stateArr[i].reason = e.target.value; });
      const amountInput = row.querySelector(".task-amount");
      if(amountInput) amountInput.addEventListener("input", e=>{ stateArr[i].amount = e.target.value; });
      const photoWrap = row.querySelector(".task-photo-wrap");
      if(photoWrap) bindPhotoWrap(photoWrap, stateArr[i]);
    });
  }

  function photoWrapHtml(state){
    if(state.photo){
      return `
        <div class="task-photo-preview">
          <img src="${state.photo}" alt="صورة المهمة">
          <button type="button" class="photo-remove-btn" title="حذف الصورة">${ICONS.close}</button>
        </div>
      `;
    }
    return `
      <label class="photo-add-btn">
        ${ICONS.camera}<span>إضافة صورة</span>
        <input type="file" accept="image/*" class="photo-input" hidden>
      </label>
    `;
  }

  function bindPhotoWrap(wrapEl, state){
    wrapEl.innerHTML = photoWrapHtml(state);
    const fileInput = wrapEl.querySelector(".photo-input");
    if(fileInput){
      fileInput.addEventListener("change", async e=>{
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        try{
          state.photo = await compressImage(file);
          wrapEl.classList.remove("needs-photo");
          bindPhotoWrap(wrapEl, state);
        }catch(err){
          toast("تعذّر تحميل الصورة، حاول مرة أخرى", true);
        }
      });
    }
    const removeBtn = wrapEl.querySelector(".photo-remove-btn");
    if(removeBtn){
      removeBtn.addEventListener("click", ()=>{
        state.photo = null;
        bindPhotoWrap(wrapEl, state);
      });
    }
  }

  const STAR_PATH = "M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6L12 3Z";

  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error("read-failed"));
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error("decode-failed"));
        img.onload = ()=>{
          const maxDim = 420;
          let w = img.width, h = img.height;
          if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          let quality = 0.5;
          let dataUrl = canvas.toDataURL("image/jpeg", quality);
          let attempts = 0;
          while(dataUrl.length > 160000 && attempts < 5){
            quality = Math.max(quality - 0.1, 0.2);
            dataUrl = canvas.toDataURL("image/jpeg", quality);
            attempts++;
          }
          resolve(dataUrl);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleSubmit(){
    const shift = config.shifts[formState.shiftKey];
    const missing = shift.sections.some(sec => formState.sections[sec.id].some(s => !s.status));
    if(missing){ toast("من فضلك حدّد حالة كل المهام قبل الإرسال", true); return; }

    try{
      const already = await findTodayEvaluation(formState.shiftKey);
      if(already){
        toast("تم تسجيل تقرير لهذا الشيفت اليوم بالفعل", true);
        renderSubmitView();
        return;
      }
    }catch(e){ /* if the check itself fails, fall through and let the submit attempt proceed */ }

    const missingPhotoRows = [];
    shift.sections.forEach(sec=>{
      const listEl = document.getElementById("section-list-"+sec.id);
      if(!listEl) return;
      const rows = listEl.querySelectorAll(".task-row");
      sec.tasks.forEach((t,i)=>{
        const state = formState.sections[sec.id][i];
        if(t.allowPhoto && state.status === "done" && !state.photo && rows[i]){
          missingPhotoRows.push(rows[i]);
        }
      });
    });
    if(missingPhotoRows.length){
      toast("لازم ترفع صورة لكل مهمة \"تمّ\" مطلوب فيها صورة قبل الإرسال", true);
      missingPhotoRows.forEach(row=>{
        const wrap = row.querySelector(".task-photo-wrap");
        if(wrap) wrap.classList.add("needs-photo");
      });
      missingPhotoRows[0].scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }

    const missingStars = (shift.employees||[]).some((name,i)=> !(formState.employeeRatings[i] && formState.employeeRatings[i].stars > 0));
    if(missingStars){
      toast("من فضلك قيّم كل موظف بعدد نجوم قبل الإرسال", true);
      const empList = document.getElementById("emp-ratings-list");
      if(empList) empList.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.innerHTML = "جارٍ الإرسال...";
    try{
      const record = {
        shiftKey: formState.shiftKey,
        shiftLabel: shift.label,
        date: todayISO(),
        responsible: shift.responsibleName.trim(),
        sections: shift.sections.map(sec => ({
          id: sec.id,
          title: sec.title,
          type: sec.type,
          tasks: sec.tasks.map((t,i)=>({ text:t.text, ...formState.sections[sec.id][i] }))
        })),
        employeeRatings: (shift.employees||[]).map((name,i)=>({
          name,
          stars: formState.employeeRatings[i].stars,
          reason: formState.employeeRatings[i].reason
        })),
        notes: config.notesFields.map((label,i)=>({label, value:formState.notes[i]})),
        submittedByUid: authUser ? authUser.uid : null,
        submittedByUsername: authProfile ? authProfile.username : null,
        submittedAt: Date.now()
      };
      await submitEvaluation(record);
      toast("تم إرسال التقييم بنجاح");
      formState = freshFormState(formState.shiftKey);
      renderSubmitView();
    }catch(e){
      toast("حدث خطأ أثناء الإرسال، حاول مرة أخرى", true);
      btn.disabled = false;
      btn.innerHTML = ICONS.send + " إرسال التقييم";
    }
  }

  function drawUsersAdmin(container){
    const pending = usersCache.filter(u=>u.data.status==="pending");
    const approved = usersCache.filter(u=>u.data.status==="approved");
    const rejected = usersCache.filter(u=>u.data.status==="rejected");
    const shiftKeys = Object.keys(config.shifts);

    function shiftSelectHtml(u){
      const current = u.data.shiftKey && config.shifts[u.data.shiftKey] ? u.data.shiftKey : shiftKeys[0];
      return `
        <select class="user-shift-select" data-shiftfor="${u.id}">

    }

      return `
        <div class="user-row" data-uid="${u.id}">

    }

    container.innerHTML = `
      <div class="label-card"><div class="tag-edge"></div><div class="body">
        <h3 class="section-title"><span class="icon-badge">${ICONS.clipboard}</span> طلبات في انتظار الموافقة</h3>
        <p class="section-hint">اختر الشيفت المناسب قبل ما توافق على الطلب.</p>
        ${pending.length===0 ? `<p class="section-hint" style="padding-right:0;">لا توجد طلبات جديدة.</p>` :
          pending.map(u=>userRow(u, `
            <button class="btn btn-primary btn-small" data-approve="${u.id}">${ICONS.check} موافقة</button>
            <button class="btn btn-danger-outline btn-small" data-reject="${u.id}">${ICONS.close} رفض</button>
          `, true)).join("")}
      </div></div>

      <div class="label-card"><div class="tag-edge"></div><div class="body">
        <h3 class="section-title"><span class="icon-badge">${ICONS.checkCircle}</span> الموظفون المعتمدون</h3>
        <p class="section-hint">الشيفت المحدد هنا هو اللي هيظهر للموظف تلقائيًا عند تسجيل التقييم.</p>
        ${approved.length===0 ? `<p class="section-hint" style="padding-right:0;">لا يوجد موظفون معتمدون بعد.</p>` :
          approved.map(u=>userRow(u,
            u.data.isAdmin ? `` : `<button class="btn btn-danger-outline btn-small" data-revoke="${u.id}">${ICONS.trash} إلغاء الصلاحية</button>`,
            !u.data.isAdmin
          )).join("")}
      </div></div>

      ${rejected.length ? `
      <div class="label-card"><div class="tag-edge"></div><div class="body">
        <h3 class="section-title"><span class="icon-badge">${ICONS.xCircle}</span> طلبات مرفوضة</h3>
        ${rejected.map(u=>userRow(u, `
          <button class="btn btn-primary btn-small" data-approve="${u.id}">${ICONS.check} موافقة</button>
          <button class="btn btn-danger-outline btn-small" data-delete="${u.id}">${ICONS.trash} حذف نهائي</button>
        `, true)).join("")}
      </div></div>` : ``}
    `;

    function currentShiftFor(uid){
      const sel = container.querySelector(`.user-shift-select[data-shiftfor="${uid}"]`);
      return sel ? sel.value : shiftKeys[0];
    }

    container.querySelectorAll("[data-approve]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const uid = btn.getAttribute("data-approve");
        try{
          await updateUserFields(uid, { status: "approved", shiftKey: currentShiftFor(uid) });
          toast("تمت الموافقة على الحساب");
          renderUsersAdmin(container);
        }catch(e){ toast("تعذّر تنفيذ العملية", true); }
      });
    });
    container.querySelectorAll("[data-reject]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        try{ await updateUserFields(btn.getAttribute("data-reject"), { status: "rejected" }); toast("تم رفض الطلب"); renderUsersAdmin(container); }
        catch(e){ toast("تعذّر تنفيذ العملية", true); }
      });
    });
    container.querySelectorAll("[data-revoke]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("هل تريد إلغاء صلاحية دخول هذا الموظف؟")) return;
        try{ await updateUserFields(btn.getAttribute("data-revoke"), { status: "pending" }); toast("تم إلغاء الصلاحية، الحساب محتاج موافقة جديدة"); renderUsersAdmin(container); }
        catch(e){ toast("تعذّر تنفيذ العملية", true); }

    container.querySelectorAll("[data-delete]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("هل تريد حذف هذا الطلب نهائيًا؟ لا يمكن التراجع عن هذا الإجراء.")) return;
        try{ await deleteUserDoc(btn.getAttribute("data-delete")); toast("تم حذف الطلب"); renderUsersAdmin(container); }

      });

    container.querySelectorAll(".user-shift-select").forEach(sel=>{
      sel.addEventListener("change", async ()=>{
        const uid = sel.getAttribute("data-shiftfor");
        const u = usersCache.find(x=>x.id===uid);
        if(u && u.data.status !== "approved"){ return; } // for pending users, shift is saved at approval time only
        try{ await updateUserFields(uid, { shiftKey: sel.value }); toast("تم تحديث الشيفت"); }

      });

  async function renderEvaluationsReview(container){
    container.innerHTML = `<div class="empty-state"><p>جارٍ تحميل التقييمات...</p></div>`;
    try{ evalCache = await listEvaluations(); }
    catch(e){ container.innerHTML = `<div class="empty-state"><p>تعذّر تحميل التقييمات. حاول تحديث الصفحة.</p></div>`; return; }
    drawEvaluationsScreen(container);
  }

  function drawEvaluationsScreen(container){
    const mode = drawEvaluationsScreen._mode || "list";
    container.innerHTML = `
      <div class="subtabs" style="margin-bottom:16px;">
        <button data-mode="list" class="${mode==='list'?'active':''}">${ICONS.clipboard} قائمة التقييمات</button>
        <button data-mode="daily" class="${mode==='daily'?'active':''}">${ICONS.clock} السجل اليومي</button>
      </div>
      <div id="eval-screen-body"></div>
    `;
    container.querySelectorAll("[data-mode]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        drawEvaluationsScreen._mode = btn.getAttribute("data-mode");
        drawEvaluationsScreen(container);
      });
    });
    const body = document.getElementById("eval-screen-body");
    if(mode === "list") drawEvaluationsList(body);
    else drawDailyLog(body);
  }

  function drawDailyLog(container){
    const month = drawDailyLog._month || todayISO().slice(0,7);
    drawDailyLog._month = month;

    container.innerHTML = `
      <div class="eval-filters">
        ${ICONS.filter}
        <input type="month" id="daily-log-month" value="${month}">
      </div>
      <div id="daily-log-list"></div>
    `;
    document.getElementById("daily-log-month").addEventListener("change", e=>{
      drawDailyLog._month = e.target.value;
      drawDailyLog(container);
    });

    const [y,m] = month.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const todayStr = todayISO();
    const shiftKeys = Object.keys(config.shifts);

    const byDate = {};
    evalCache.forEach(({data})=>{
      if((data.date||"").slice(0,7) !== month) return;
      if(!byDate[data.date]) byDate[data.date] = {};
      byDate[data.date][data.shiftKey] = true;
    });

    const listEl = document.getElementById("daily-log-list");
    const rows = [];
    for(let d=daysInMonth; d>=1; d--){
      const dateStr = `${month}-${String(d).padStart(2,"0")}`;
      if(dateStr > todayStr) continue;
      rows.push({ dateStr, dayShifts: byDate[dateStr] || {} });
    }

    if(rows.length === 0){
      listEl.innerHTML = `<div class="empty-state"><p>لا توجد أيام لعرضها.</p></div>`;
      return;
    }
    if(shiftKeys.length === 0){
      listEl.innerHTML = `<div class="empty-state"><p>لا توجد شيفتات مضافة بعد.</p></div>`;
      return;
    }

    listEl.innerHTML = rows.map(({dateStr, dayShifts})=>{
      const dateLabel = new Date(dateStr+"T00:00:00").toLocaleDateString("ar-EG", { weekday:"long", day:"numeric", month:"long" });
      return `
        <div class="label-card"><div class="tag-edge"></div><div class="body">
          <h3 class="section-title" style="margin-bottom:12px;">${dateLabel}</h3>
          <div class="day-shift-pills">
            ${shiftKeys.map(k=>{
              const done = !!dayShifts[k];
              return `<span class="day-shift-pill ${done?'done':'missing'}">${done?ICONS.checkCircle:ICONS.xCircle} ${escapeHtml(config.shifts[k].label)}</span>`;
            }).join("")}
          </div>
        </div></div>
      `;
    }).join("");
  }

  async function renderMonthlyRatings(container){
    container.innerHTML = `<div class="empty-state"><p>جارٍ تحميل البيانات...</p></div>`;
    let items;
    try{ items = await listEvaluations(); }
    catch(e){ container.innerHTML = `<div class="empty-state"><p>تعذّر تحميل التقييمات. حاول تحديث الصفحة.</p></div>`; return; }
    evalCache = items;
    drawMonthlyRatings(container, items);
  }

  function drawMonthlyRatings(container, items){
    const month = drawMonthlyRatings._month || todayISO().slice(0,7);
    drawMonthlyRatings._month = month;

    const shiftLabelMap = {};
    Object.keys(config.shifts).forEach(k=>{ shiftLabelMap[k] = config.shifts[k].label; });
    items.forEach(({data})=>{ if(!shiftLabelMap[data.shiftKey]) shiftLabelMap[data.shiftKey] = data.shiftLabel; });

    const monthItems = items.filter(({data})=> (data.date||"").slice(0,7) === month);

    container.innerHTML = `
      <div class="eval-filters">
        ${ICONS.filter}
        <input type="month" id="ratings-month" value="${month}">
      </div>
      <div id="ratings-cards"></div>
    `;
    document.getElementById("ratings-month").addEventListener("change", e=>{
      drawMonthlyRatings._month = e.target.value;
      drawMonthlyRatings(container, items);
    });

    const cardsEl = document.getElementById("ratings-cards");
    const shiftKeys = Object.keys(shiftLabelMap);
    if(shiftKeys.length === 0){
      cardsEl.innerHTML = `<div class="empty-state"><div class="mark">${ICONS.checkCircle}</div><p>لا توجد بيانات بعد.</p></div>`;
      return;
    }

    cardsEl.innerHTML = shiftKeys.map(k=>{
      const shiftItems = monthItems.filter(({data})=>data.shiftKey===k);
      const scored = shiftItems.filter(({data})=>data.adminScore!=null);
      const total = shiftItems.length;

      let scoreBlockHtml;
      if(total === 0){
        scoreBlockHtml = `<p class="section-hint" style="padding-right:0;">لا توجد تقييمات لهذا الشيفت في الشهر المحدد.</p>`;
      } else if(scored.length === 0){
        scoreBlockHtml = `<p class="section-hint" style="padding-right:0;">${total} تقييم هذا الشهر، لسه مفيش درجات مُسجّلة.</p>`;
      } else {
        const avg = Math.round(scored.reduce((s,{data})=>s+data.adminScore,0) / scored.length);
        const grade = scoreToGrade(avg);
        scoreBlockHtml = `
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="grade-badge ${grade.cls}">${avg}% — ${grade.label}</span>
          </div>
          <p class="section-hint" style="padding-right:0;margin-top:10px;">${scored.length} من أصل ${total} تقييم تم تقييمهم هذا الشهر.</p>
        `;
      }

      const empTotals = {};
      shiftItems.forEach(({data})=>{
        (data.employeeRatings||[]).forEach(er=>{
          if(!er || !er.name) return;
          if(!empTotals[er.name]) empTotals[er.name] = { stars:0, count:0 };
          empTotals[er.name].stars += (er.stars||0);
          empTotals[er.name].count += 1;
        });
      });
      const empList = Object.keys(empTotals).map(name=>({ name, ...empTotals[name] })).sort((a,b)=>b.stars-a.stars);

      return `
        <div class="label-card"><div class="tag-edge"></div><div class="body">
          <h3 class="section-title"><span class="icon-badge">${shiftIcon(k)}</span> ${escapeHtml(shiftLabelMap[k])}</h3>
          ${scoreBlockHtml}
          ${empList.length ? `
            <div class="emp-rank-block">
              <div class="emp-rank-title">${ICONS.star} أفضل موظف هذا الشهر: <strong>${escapeHtml(empList[0].name)}</strong> (${empList[0].stars} نجمة)</div>
              <div class="emp-rank-list">
                ${empList.map((e,idx)=>`
                  <div class="emp-rank-row ${idx===0?'top':''}">
                    <span>${idx+1}. ${escapeHtml(e.name)}</span>
                    <span>${e.stars} ⭐ (${e.count} تقييم)</span>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ``}
        </div></div>
      `;
    }).join("");
  }

  function drawEvaluationsList(container){
    const shiftFilter = drawEvaluationsList._shift || "all";
    const dateFilter = drawEvaluationsList._date || "";

    const shiftLabelMap = {};
    Object.keys(config.shifts).forEach(k=>{ shiftLabelMap[k] = config.shifts[k].label; });
    evalCache.forEach(({data})=>{ if(!shiftLabelMap[data.shiftKey]) shiftLabelMap[data.shiftKey] = data.shiftLabel; });

    container.innerHTML = `
      <div class="eval-filters">
        ${ICONS.filter}
        <select id="filter-shift">
          <option value="all" ${shiftFilter==='all'?'selected':''}>كل الشيفتات</option>
          ${Object.keys(shiftLabelMap).map(k=>`<option value="${k}" ${shiftFilter===k?'selected':''}>${escapeHtml(shiftLabelMap[k])}</option>`).join("")}
        </select>
        <input type="date" id="filter-date" value="${dateFilter}">
        <button class="btn btn-ghost btn-small" id="clear-filters">إلغاء الفلاتر</button>
      </div>
      <div id="eval-list"></div>
    `;

    document.getElementById("filter-shift").addEventListener("change", e=>{ drawEvaluationsList._shift = e.target.value; drawEvaluationsList(container); });
    document.getElementById("filter-date").addEventListener("change", e=>{ drawEvaluationsList._date = e.target.value; drawEvaluationsList(container); });
    document.getElementById("clear-filters").addEventListener("click", ()=>{ drawEvaluationsList._shift="all"; drawEvaluationsList._date=""; drawEvaluationsList(container); });

    let items = evalCache;
    if(shiftFilter !== "all") items = items.filter(x=>x.data.shiftKey===shiftFilter);
    if(dateFilter) items = items.filter(x=>x.data.date===dateFilter);

    const list = document.getElementById("eval-list");
    if(items.length === 0){
      list.innerHTML = `<div class="empty-state"><div class="mark">${ICONS.clipboard}</div><p>لا توجد تقييمات مطابقة بعد.</p></div>`;
      return;
    }

    list.innerHTML = items.map(({id, data})=>{
      const allTasks = evalSections(data).flatMap(sec=>sec.tasks);
      const okCount = allTasks.filter(t=>t.status==="done").length;
      const badCount = allTasks.length - okCount;
      const timeStr = formatTime(data.submittedAt);
      return `
        <div class="eval-item" data-id="${id}" data-shift="${data.shiftKey}">
          <span class="eval-icon">${shiftIcon(data.shiftKey)}</span>
          <div class="eval-item-body">
            <div>
              <span class="eval-badge ${data.shiftKey}">${escapeHtml(data.shiftLabel)}</span>
              <div class="eval-meta">${escapeHtml(data.date)}${timeStr?' — '+timeStr:''} — ${escapeHtml(data.responsible)}</div>
            </div>
            <div class="eval-stats">
              ${data.adminScore!=null ? `<span class="stat-pill score-pill">${data.adminScore}%</span>` : ""}
              <span class="stat-pill ok">${ICONS.checkCircle} ${okCount}</span>
              ${badCount ? `<span class="stat-pill bad">${ICONS.xCircle} ${badCount}</span>` : ""}
            </div>
          </div>
          <button class="icon-btn eval-quick-delete" data-quickdelete="${id}" title="حذف التقييم">${ICONS.trash}</button>
        </div>
      `;
    }).join("");

    list.querySelectorAll(".eval-item").forEach(el=>{
      el.addEventListener("click", (e)=>{
        if(e.target.closest(".eval-quick-delete")) return;
        const item = evalCache.find(x=>x.id===el.getAttribute("data-id"));
        if(item) openEvalDetail(item, container);
      });
    });

    list.querySelectorAll(".eval-quick-delete").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute("data-quickdelete");
        if(!confirm("هل تريد حذف هذا التقييم نهائيًا؟")) return;
        try{
          await deleteEvaluation(id);
          evalCache = evalCache.filter(x=>x.id!==id);
          drawEvaluationsList(container);
          toast("تم حذف التقييم");
        }catch(err){ toast("تعذّر الحذف، حاول مرة أخرى", true); }
      });
    });
  }

    lb.innerHTML = `<img src="${src}" alt="صورة">`;
    lb.addEventListener("click", ()=> lb.remove());

  function openEvalDetail(item, listContainer){
    const d = item.data;
    const sections = evalSections(d);
    function rowsHtml(arr){
      return arr.map(t=>`
        <div class="detail-row">
          <div>
            ${escapeHtml(t.text)}
            ${t.reason ? `<div class="detail-note">${t.status==='done'?'ملاحظة':'السبب'}: ${escapeHtml(t.reason)}</div>` : ""}
            ${t.amount ? `<div class="detail-note">القيمة: ${escapeHtml(t.amount)}</div>` : ""}
            ${t.photo ? `<div class="detail-photo"><img src="${t.photo}" alt="صورة المهمة" class="photo-view-trigger"></div>` : ""}
          </div>
          <span class="status ${t.status==='done'?'ok':'bad'}">${t.status==='done'?ICONS.checkCircle+' تمّ':ICONS.xCircle+' لم يتم'}</span>
        </div>
      `).join("");
    }
    const notesHtml = d.notes.filter(n=>n.value && n.value.trim()).map(n=>`
      <div class="detail-row"><div><strong>${escapeHtml(n.label)}</strong><div class="detail-note">${escapeHtml(n.value)}</div></div></div>
    `).join("") || `<p class="section-hint" style="padding-right:0;">لا توجد ملاحظات مكتوبة.</p>`;

    const sectionsHtml = sections.map(sec=>`
      <div class="detail-block"><h4>${sectionIcon(sec)} ${escapeHtml(sec.title)}</h4>${rowsHtml(sec.tasks)}</div>
    `).join("");

    const empRatingsHtml = (d.employeeRatings && d.employeeRatings.length) ? `
      <div class="detail-block"><h4>${ICONS.star} تقييم الموظفين</h4>
        ${d.employeeRatings.map(er=>`
          <div class="detail-row">
            <div>
              ${escapeHtml(er.name)}
              ${er.reason ? `<div class="detail-note">${escapeHtml(er.reason)}</div>` : ""}
            </div>
            <span class="status ok">${"⭐".repeat(er.stars||0)}</span>
          </div>
        `).join("")}
      </div>
    ` : "";

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <div>
            <h2>${escapeHtml(d.shiftLabel)}</h2>
            <div class="eval-meta">${escapeHtml(d.date)}${formatTime(d.submittedAt)?' — '+formatTime(d.submittedAt):''} — المسؤول: ${escapeHtml(d.responsible)}</div>
          </div>
          <button class="close-x" id="close-modal">${ICONS.close}</button>
        </div>
        ${sectionsHtml}
        ${empRatingsHtml}
        <div class="detail-block"><h4>${ICONS.notebook} ملاحظات الشيفت</h4>${notesHtml}</div>

        <div class="label-card score-card"><div class="tag-edge"></div><div class="body">
          <h3 class="section-title"><span class="icon-badge">${ICONS.checkCircle}</span> تقييم المدير</h3>
          <p class="section-hint">حدّد نسبة من 100% لأداء الشيفت ده، واكتب سبب الدرجة.</p>
          <div class="field-row">
            <div class="field">
              <label>الدرجة (من 100)</label>
              <input type="number" id="score-input" min="0" max="100" step="1" value="${d.adminScore!=null?d.adminScore:''}" placeholder="مثال: 85">
            </div>
          </div>
          <div class="field" style="margin-top:12px;">
            <label>سبب الدرجة</label>
            <textarea id="score-note" placeholder="اكتب سبب الدرجة (اختياري)">${escapeHtml(d.adminScoreNote||"")}</textarea>
          </div>
          <div class="submit-bar" style="margin-top:14px;">
            <button class="btn btn-primary btn-small" id="save-score">${ICONS.check} حفظ الدرجة</button>
          </div>
        </div></div>

        <div class="submit-bar">
          <button class="btn btn-danger-outline btn-small" id="delete-eval">${ICONS.trash} حذف هذا التقييم</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.addEventListener("click", e=>{ if(e.target===backdrop) backdrop.remove(); });
    backdrop.querySelector("#close-modal").addEventListener("click", ()=>backdrop.remove());
    backdrop.querySelectorAll(".photo-view-trigger").forEach(img=>{
      img.addEventListener("click", ()=> openPhotoLightbox(img.src));
    });
    backdrop.querySelector("#save-score").addEventListener("click", async ()=>{
      const raw = document.getElementById("score-input").value;
      const note = document.getElementById("score-note").value;
      if(raw === ""){ toast("اكتب درجة من 0 إلى 100", true); return; }
      const score = Math.max(0, Math.min(100, Math.round(Number(raw))));
      if(Number.isNaN(score)){ toast("الدرجة لازم تكون رقم", true); return; }
      const btn = document.getElementById("save-score");
      btn.disabled = true;
      try{
        await updateEvaluationScore(item.id, score, note);
        item.data.adminScore = score;
        item.data.adminScoreNote = note;
        toast("تم حفظ الدرجة");
        backdrop.remove();
        drawEvaluationsList(listContainer);
      }catch(e){
        btn.disabled = false;
        toast("تعذّر حفظ الدرجة، حاول مرة أخرى", true);
      }
    });

    backdrop.querySelector("#delete-eval").addEventListener("click", async ()=>{
      if(!confirm("هل تريد حذف هذا التقييم نهائيًا؟")) return;
      try{
        await deleteEvaluation(item.id);
        evalCache = evalCache.filter(x=>x.id!==item.id);
        backdrop.remove();
        drawEvaluationsList(listContainer);
        toast("تم حذف التقييم");
      }catch(e){ toast("تعذّر الحذف، حاول مرة أخرى", true); }
    });
  }

  /* ---------------- Sidebar / main navigation ---------------- */
  const sidebarEl = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebarBackdrop");
  const menuToggleBtn = document.getElementById("menuToggle");

  function openSidebar(){ sidebarEl.classList.add("open"); sidebarBackdrop.classList.add("show"); }
  function closeSidebar(){ sidebarEl.classList.remove("open"); sidebarBackdrop.classList.remove("show"); }

  menuToggleBtn.addEventListener("click", openSidebar);
  document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
  sidebarBackdrop.addEventListener("click", closeSidebar);

  document.getElementById("sidebarNav").addEventListener("click", e=>{
    const btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    activeMainTab = btn.getAttribute("data-tab");
    closeSidebar();
    renderAppShell();
  });

  function updateSidebarForRole(){
    const nav = document.getElementById("sidebarNav");
    const isAdmin = !!(authProfile && authProfile.isAdmin);
    nav.innerHTML = `
      <button class="sidebar-link ${activeMainTab==='submit'?'active':''}" data-tab="submit">
        ${ICONS.plus} تسجيل تقييم
      </button>
      <button class="sidebar-link ${activeMainTab==='myratings'?'active':''}" data-tab="myratings">
        ${ICONS.checkCircle} تقييماتي
      </button>
      ${isAdmin ? `
      <button class="sidebar-link ${activeMainTab==='dashboard'?'active':''}" data-tab="dashboard">
        ${ICONS.settings} الإعدادات
      </button>` : ``}
      <button class="sidebar-link" id="logout-btn" type="button">
        ${ICONS.close} تسجيل الخروج
      </button>
    `;
    document.getElementById("logout-btn").addEventListener("click", async ()=>{
      closeSidebar();
      try{ await signOutUser(); }catch(e){}
    });
  }

  async function renderMyRatings(){
    view.innerHTML = `<div class="empty-state"><p>جارٍ التحميل...</p></div>`;
    let items;
    try{ items = await listMyEvaluations(authUser.uid); }
    catch(e){ view.innerHTML = `<div class="empty-state"><p>تعذّر تحميل التقييمات. حاول تحديث الصفحة.</p></div>`; return; }
    drawMyRatings(items);
  }

  function drawMyRatings(items){
    if(items.length === 0){
      view.innerHTML = `<div class="empty-state"><div class="mark">${ICONS.clipboard}</div><p>لسه معملتش أي تقييم.</p></div>`;
      return;
    }
    view.innerHTML = items.map(({data})=>{
      const timeStr = formatTime(data.submittedAt);
      const scored = data.adminScore != null;
      const grade = scored ? scoreToGrade(data.adminScore) : null;
      return `
        <div class="label-card"><div class="tag-edge"></div><div class="body">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
            <div>
              <span class="eval-badge ${data.shiftKey}">${escapeHtml(data.shiftLabel)}</span>
              <div class="eval-meta">${escapeHtml(data.date)}${timeStr?' — '+timeStr:''}</div>
            </div>
            ${scored ? `<span class="grade-badge ${grade.cls}">${data.adminScore}% — ${grade.label}</span>` : `<span class="stat-pill" style="background:var(--bg);color:var(--muted);">لسه ما اتقيّمش</span>`}
          </div>
          ${data.adminScoreNote ? `<p class="section-hint" style="padding-right:0;margin-top:10px;"><strong>ملحوظة المدير:</strong> ${escapeHtml(data.adminScoreNote)}</p>` : ``}
        </div></div>
      `;
    }).join("");
  }

  /* ---------------- Auth screens ---------------- */
  function authErrorMessage(e){
    const code = e && e.code;
    if(code === "auth/email-already-in-use") return "اسم المستخدم ده مستخدم بالفعل";
    if(code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential") return "اسم المستخدم أو كلمة السر غلط";
    if(code === "auth/weak-password") return "كلمة السر ضعيفة، اكتب 6 حروف على الأقل";
    if(code === "auth/invalid-email") return "اسم المستخدم غير صالح، استخدم حروف وأرقام بس";
    return "حدث خطأ، حاول مرة أخرى";
  }

  function renderAuthScreen(){
    const isLogin = authScreenMode === "login";
    view.innerHTML = `
      <div class="pin-gate" style="max-width:380px;">
        <div class="mark">${ICONS.lock}</div>
        <h2 style="font-family:'Cairo',sans-serif;margin:0 0 6px;">${isLogin ? "تسجيل الدخول" : "إنشاء حساب جديد"}</h2>
        <p style="color:var(--muted);font-size:13.5px;margin:0;">${isLogin ? "ادخل باسم المستخدم وكلمة السر بتاعتك" : "هيتم إرسال طلبك للمدير للموافقة عليه"}</p>
        <div class="field" style="text-align:right;margin-top:16px;">
          <label>اسم المستخدم</label>
          <input type="text" id="auth-username" placeholder="مثال: mohamed">
        </div>
        <div class="field" style="text-align:right;margin-top:12px;">
          <label>كلمة السر</label>
          <input type="password" id="auth-password" placeholder="••••••">
        </div>
        <div class="pin-error" id="auth-error"></div>
        <button class="btn btn-primary" id="auth-submit" style="width:100%;justify-content:center;margin-top:6px;">
          ${isLogin ? "دخول" : "إرسال الطلب"}
        </button>
        <button class="btn btn-ghost" id="auth-switch" style="width:100%;justify-content:center;margin-top:8px;">
          ${isLogin ? "مفيش عندك حساب؟ سجّل جديد" : "عندك حساب بالفعل؟ سجّل دخول"}
        </button>
      </div>
    `;
    document.getElementById("auth-switch").addEventListener("click", ()=>{
      authScreenMode = isLogin ? "signup" : "login";
      renderAuthScreen();
    });
    document.getElementById("auth-submit").addEventListener("click", async ()=>{
      const username = document.getElementById("auth-username").value.trim();
      const password = document.getElementById("auth-password").value;
      const errEl = document.getElementById("auth-error");
      errEl.textContent = "";
      if(!username || !password){ errEl.textContent = "اكتب اسم المستخدم وكلمة السر"; return; }
      if(password.length < 6){ errEl.textContent = "كلمة السر لازم تكون 6 حروف على الأقل"; return; }
      const btn = document.getElementById("auth-submit");
      btn.disabled = true;
      try{
        if(isLogin){
          await signInUser(username, password);
        } else {
          const becameAdmin = await signUpUser(username, password);
          if(!becameAdmin) toast("تم إرسال طلبك، استنى موافقة المدير");
        }
      }catch(e){
        btn.disabled = false;
        errEl.textContent = authErrorMessage(e);
      }
    });
  }

  function renderPendingScreen(){
    view.innerHTML = `
      <div class="pin-gate">
        <div class="mark">${ICONS.clock}</div>
        <h2 style="font-family:'Cairo',sans-serif;margin:0 0 6px;">في انتظار موافقة المدير</h2>
        <p style="color:var(--muted);font-size:13.5px;margin:0;">تم استلام طلبك، هتقدر تدخل بعد ما المدير يوافق عليك.</p>
        <button class="btn btn-ghost" id="pending-logout" style="width:100%;justify-content:center;margin-top:16px;">تسجيل الخروج</button>
      </div>
    `;
    document.getElementById("pending-logout").addEventListener("click", async ()=>{ try{ await signOutUser(); }catch(e){} });
  }

  function renderRejectedScreen(){
    view.innerHTML = `
      <div class="pin-gate">
        <div class="mark">${ICONS.xCircle}</div>
        <h2 style="font-family:'Cairo',sans-serif;margin:0 0 6px;">تم رفض الطلب</h2>
        <p style="color:var(--muted);font-size:13.5px;margin:0;">تواصل مع المدير لمعرفة السبب.</p>
        <button class="btn btn-ghost" id="rejected-logout" style="width:100%;justify-content:center;margin-top:16px;">تسجيل الخروج</button>
      </div>
    `;
    document.getElementById("rejected-logout").addEventListener("click", async ()=>{ try{ await signOutUser(); }catch(e){} });
  }

  /* ---------------- App shell router ---------------- */
  function renderAppShell(){
    if(usingFallback){
      menuToggleBtn.style.display = "none";
      view.innerHTML = `
        <div class="pin-gate">
          <div class="mark">${ICONS.info}</div>
          <h2 style="font-family:'Cairo',sans-serif;margin:0 0 6px;">تسجيل الدخول غير متاح الآن</h2>
          <p style="color:var(--muted);font-size:13.5px;margin:0;">تأكد من الاتصال بالإنترنت وحدّث الصفحة.</p>
        </div>
      `;
      return;
    }
    if(!authReady){
      menuToggleBtn.style.display = "none";
      view.innerHTML = `<div class="empty-state"><p>جارٍ التحقق من الحساب...</p></div>`;
      return;
    }
    if(!authUser){
      menuToggleBtn.style.display = "none";
      renderAuthScreen();
      return;
    }
    if(!authProfile){
      menuToggleBtn.style.display = "none";
      view.innerHTML = `
        <div class="pin-gate">
          <div class="mark">${ICONS.info}</div>
          <h2 style="font-family:'Cairo',sans-serif;margin:0 0 6px;">لا يوجد حساب مرتبط</h2>
          <p style="color:var(--muted);font-size:13.5px;margin:0;">تم حذف طلبك أو حسابك. سجّل الخروج وأنشئ حسابًا جديدًا لو محتاج.</p>
          <button class="btn btn-ghost" id="noprofile-logout" style="width:100%;justify-content:center;margin-top:16px;">تسجيل الخروج</button>
        </div>
      `;
      document.getElementById("noprofile-logout").addEventListener("click", async ()=>{ try{ await signOutUser(); }catch(e){} });
      return;
    }
    if(authProfile.status === "pending"){
      menuToggleBtn.style.display = "none";
      renderPendingScreen();
      return;
    }
    if(authProfile.status === "rejected"){
      menuToggleBtn.style.display = "none";
      renderRejectedScreen();
      return;
    }
    menuToggleBtn.style.display = "";
    updateSidebarForRole();
    if(activeMainTab === "submit") renderSubmitView();
    else if(activeMainTab === "myratings") renderMyRatings();
    else renderDashboard();
  }

  /* ---------------- Init ---------------- */
  if(usingFallback){
    renderAppShell();
  } else {
    auth.onAuthStateChanged(async (user)=>{
      authUser = user;
      authProfile = user ? await fetchUserProfile(user.uid) : null;
      authReady = true;
      if(authUser && authProfile && authProfile.status === "approved" && !config){
        try{ config = await loadConfig(); }catch(e){ config = defaultConfig(); }
      }
      renderAppShell();
    });
  }
})();
</script>
</body>
</html>
